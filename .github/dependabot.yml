# Opens pull requests when dependencies have security fixes or updates.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/01-todo-api"
      - "/02-user-auth-api"
      - "/03-notes-app-backend"
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
